<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="p2Accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#p2Bg)" />
  <rect x="2" y="2" width="796" height="446" rx="15" fill="none" stroke="#134e4a" stroke-width="1.5" />

  <!-- Relational DB Schema Illustration -->
  <!-- Table 1: Customers -->
  <g transform="translate(60, 60)">
    <rect width="180" height="150" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <rect width="180" height="32" rx="8" fill="#0e7490" />
    <text x="90" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">customers (PK)</text>
    <text x="15" y="58" font-family="monospace" font-size="11" fill="#67e8f9">customer_id [PK]</text>
    <text x="15" y="80" font-family="monospace" font-size="11" fill="#cbd5e1">first_name, email</text>
    <text x="15" y="102" font-family="monospace" font-size="11" fill="#cbd5e1">signup_date</text>
    <text x="15" y="125" font-family="monospace" font-size="11" fill="#a5f3fc">total_spend (CLV)</text>
  </g>

  <!-- Table 2: Orders -->
  <g transform="translate(310, 60)">
    <rect width="180" height="150" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect width="180" height="32" rx="8" fill="#047857" />
    <text x="90" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">orders (100K+ rows)</text>
    <text x="15" y="58" font-family="monospace" font-size="11" fill="#6ee7b7">order_id [PK]</text>
    <text x="15" y="80" font-family="monospace" font-size="11" fill="#67e8f9">customer_id [FK]</text>
    <text x="15" y="102" font-family="monospace" font-size="11" fill="#cbd5e1">order_date [INDEX]</text>
    <text x="15" y="125" font-family="monospace" font-size="11" fill="#cbd5e1">order_total, status</text>
  </g>

  <!-- Table 3: Order_Items -->
  <g transform="translate(560, 60)">
    <rect width="180" height="150" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="180" height="32" rx="8" fill="#b45309" />
    <text x="90" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">order_items</text>
    <text x="15" y="58" font-family="monospace" font-size="11" fill="#fde68a">item_id [PK]</text>
    <text x="15" y="80" font-family="monospace" font-size="11" fill="#6ee7b7">order_id [FK]</text>
    <text x="15" y="102" font-family="monospace" font-size="11" fill="#cbd5e1">product_id [FK]</text>
    <text x="15" y="125" font-family="monospace" font-size="11" fill="#cbd5e1">unit_price * qty</text>
  </g>

  <!-- Relationship Connectors -->
  <path d="M 240 100 L 310 100" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2" />
  <circle cx="242" cy="100" r="3" fill="#06b6d4" />
  <circle cx="308" cy="100" r="3" fill="#06b6d4" />

  <path d="M 490 100 L 560 100" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2" />
  <circle cx="492" cy="100" r="3" fill="#10b981" />
  <circle cx="558" cy="100" r="3" fill="#10b981" />

  <!-- Bottom Analytics & Window Function Console -->
  <g transform="translate(60, 240)">
    <rect width="680" height="120" rx="10" fill="#021c1e" stroke="#134e4a" stroke-width="1.5" />
    <rect width="680" height="26" rx="10" fill="#0f2b2e" />
    <circle cx="18" cy="13" r="4" fill="#ef4444" />
    <circle cx="32" cy="13" r="4" fill="#f59e0b" />
    <circle cx="46" cy="13" r="4" fill="#10b981" />
    <text x="70" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#5eead4">SQL Window Analytics Query: DENSE_RANK() &amp; SUM() OVER(PARTITION BY...)</text>

    <!-- Code snippet preview -->
    <text x="20" y="55" font-family="monospace" font-size="11" fill="#93c5fd">SELECT customer_id, SUM(order_total) AS clv,</text>
    <text x="20" y="75" font-family="monospace" font-size="11" fill="#34d399">       DENSE_RANK() OVER(ORDER BY SUM(order_total) DESC) AS rank_tier</text>
    <text x="20" y="95" font-family="monospace" font-size="11" fill="#cbd5e1">FROM orders JOIN order_items USING(order_id) GROUP BY customer_id;</text>

    <!-- Result stats pill -->
    <g transform="translate(480, 42)">
      <rect width="180" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="90" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#6ee7b7" text-anchor="middle">+30% Query Speed</text>
      <text x="90" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#a7f3d0" text-anchor="middle">-40% Reporting Time</text>
    </g>
  </g>

  <!-- Bottom tag banner -->
  <rect x="180" y="380" width="440" height="40" rx="20" fill="#0f172a" stroke="url(#p2Accent)" stroke-width="1.5" />
  <text x="400" y="405" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f0fdf4" text-anchor="middle">MySQL 8.0 • 3NF Normalization • Window Functions • 100K+ Records</text>
</svg>
