<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" />

  <!-- Outer Ambient Tech Ring -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.6" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" />

  <!-- Glowing Glow Behind Silhouette -->
  <circle cx="250" cy="230" r="140" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />

  <!-- Developer Silhouette / Avatar Figure -->
  <!-- Shoulders & Torso -->
  <path d="M 120 440 C 130 330, 180 300, 250 300 C 320 300, 370 330, 380 440 Z" fill="url(#avatarGrad)" />
  <path d="M 180 305 L 250 365 L 320 305 Z" fill="#1e293b" opacity="0.7" />
  
  <!-- Head & Face -->
  <ellipse cx="250" cy="205" rx="72" ry="85" fill="#f1f5f9" />
  <!-- Hair styling -->
  <path d="M 175 190 C 175 125, 220 115, 250 115 C 280 115, 325 125, 325 190 C 325 170, 310 140, 280 140 C 255 140, 240 150, 215 145 C 195 140, 180 160, 175 190 Z" fill="#0f172a" />
  <!-- Modern Glasses -->
  <rect x="195" y="185" width="45" height="28" rx="8" fill="none" stroke="#2563eb" stroke-width="4" />
  <rect x="260" y="185" width="45" height="28" rx="8" fill="none" stroke="#2563eb" stroke-width="4" />
  <line x1="240" y1="198" x2="260" y2="198" stroke="#2563eb" stroke-width="4" />

  <!-- Code / Tech Badges Floating -->
  <g transform="translate(45, 110)">
    <rect width="90" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="45" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">&lt;React /&gt;</text>
  </g>

  <g transform="translate(365, 110)">
    <rect width="90" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="45" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa" text-anchor="middle">Python 3</text>
  </g>

  <g transform="translate(50, 360)">
    <rect width="85" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="42" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Flask API</text>
  </g>

  <g transform="translate(365, 360)">
    <rect width="85" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="42" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">SQL DB</text>
  </g>

  <!-- Bottom Floating Badge: Mahesh Miriyala B.Tech '26 -->
  <g transform="translate(130, 435)">
    <rect width="240" height="42" rx="21" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2" />
    <text x="120" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Miriyala Mahesh • B.Tech '26</text>
  </g>
</svg>
